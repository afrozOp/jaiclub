<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subordinate Data - JAICLUB</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sub-header {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .search-container {
            padding: 0 15px;
            margin-bottom: 20px;
            position: relative;
        }

        .search-input {
            width: 100%;
            background: var(--card-bg);
            border: none;
            border-radius: 8px;
            padding: 12px 15px;
            color: white;
            padding-right: 50px;
        }

        .search-btn {
            position: absolute;
            right: 25px;
            top: 50%;
            transform: translateY(-50%);
            background: #A08FFF;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #A08FFF;
        }

        .filter-row {
            display: flex;
            gap: 10px;
            padding: 0 15px;
            margin-bottom: 20px;
        }

        .filter-btn {
            flex: 1;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .data-grid {
            margin: 0 15px;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            text-align: center;
            gap: 20px;
            border-radius: 12px;
            background: #A08FFF;
        }

        .data-item {
            position: relative;
        }

        .data-item:nth-child(even)::before {
            content: '';
            position: absolute;
            left: -10px;
            top: 10%;
            height: 80%;
            width: 1px;
            background: #93939D;
        }

        .data-value {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .data-label {
            font-size: 11px;
            color: #ffffff;
            line-height: 1.2;
        }

        .no-data {
            text-align: center;
            padding: 50px 0;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Hide calendar icon and style date input as a clean dropdown */
        #subordinate-date-select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>") !important;
            background-repeat: no-repeat !important;
            background-position: right 10px center !important;
            background-size: 20px !important;
            padding-right: 30px !important;
            position: relative;
        }

        #subordinate-date-select::-webkit-calendar-picker-indicator {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        /* Custom arrow style for Tier select to match original screen */
        #subordinate-level-select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%2393939D' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z'/></svg>") !important;
            background-repeat: no-repeat !important;
            background-position: right 10px center !important;
            background-size: 16px !important;
            padding-right: 30px !important;
        }

        #subordinate-level-select option {
            background-color: #17182e !important;
            color: #ffffff !important;
        }

        /* Custom bottom sheet modal picker */
        .picker-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10000;
        }

        .picker-container {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 450px;
            background: #17182e;
            border-radius: 20px 20px 0 0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            z-index: 10001;
            overflow: hidden;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translate(-50%, 100%);
            }

            to {
                transform: translate(-50%, 0);
            }
        }

        .picker-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: #20213d;
        }

        .picker-header span {
            font-size: 15px;
            font-weight: bold;
            color: #fff;
        }

        .picker-header .btn-cancel {
            color: #88889d;
            cursor: pointer;
            font-size: 14px;
        }

        .picker-header .btn-confirm {
            color: #A08FFF;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .picker-body {
            display: flex;
            height: 220px;
            position: relative;
            padding: 10px 0;
            background: #17182e;
        }

        .picker-column {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: none;
            text-align: center;
            position: relative;
            height: 100%;
        }

        .picker-column::-webkit-scrollbar {
            display: none;
        }

        .picker-item {
            height: 44px;
            line-height: 44px;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.3);
            transition: all 0.2s;
            cursor: pointer;
        }

        .picker-item.selected {
            color: #ffffff;
            font-weight: bold;
            font-size: 17px;
        }

        .picker-highlight {
            position: absolute;
            top: 88px;
            left: 0;
            width: 100%;
            height: 44px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            pointer-events: none;
            background: rgba(255, 255, 255, 0.02);
        }
    </style>
</head>

<body>

    <div class="purple-subpage__nav"
        style="position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 450px; height: 55px; background: #17182e; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 15px rgba(0,0,0,0.3); overflow: hidden;">

        <a href="promotion.html"
            style="cursor: pointer; position: relative; z-index: 1; color: white; font-size: 18px; width: 40px; display: flex; align-items: center;">
            <i class="fas fa-chevron-left"></i>

        <!-- Center (Title) -->
        <div

            Subordinate data
        </div>
        <!-- Right (Spacer for centering) -->
        <div style="width: 40px; position: relative; z-index: 1;"></div>

    <div class="search-container">
        <input type="text" id="subordinate-search" class="search-input" placeholder="Search subordinate UID">

    <div class="filter-row">
        <!-- Tier Level Dropdown Trigger -->
        <div class="filter-btn tier-picker-trigger" id="tier-picker-trigger"

    <script>
        // ---- Helper: get current selected date ----
        function getCurrentSubDate() {
            const el = document.getElementById('subordinate-date-select');
            return el ? el.value : '2026-05-26';
        }

        // ---- Load stats for a specific date ----
        function loadStatsForDate(date) {
            document.querySelectorAll('.stat-editable').forEach(el => {
                const key = 'sub_' + date + '_' + el.id;
                const savedVal = localStorage.getItem(key);
                el.textContent = (savedVal !== null) ? savedVal : '0';
            });
        }

        // ---- Make stats editable on double click, save per-date ----
        document.querySelectorAll('.stat-editable').forEach(el => {
            el.addEventListener('dblclick', function () {
                const currentDate = getCurrentSubDate();
                const currentVal = this.textContent.trim();
                const newVal = prompt("Enter new value:", currentVal);
                if (newVal !== null && newVal !== "") {
                    this.textContent = newVal;
                    // Persist with date-specific key
                    localStorage.setItem('sub_' + currentDate + '_' + this.id, newVal);
                }
            });
        });

        // Load stats for the initial date on page load
        loadStatsForDate(getCurrentSubDate());

        // ---- Shared Picker Helpers ----
        const createPaddingItem = () => {
            const div = document.createElement('div');
            div.className = 'picker-item';
            div.style.pointerEvents = 'none';
            div.innerHTML = '&nbsp;';
            return div;
        };

        const populateCol = (colId, items, currentVal, onSelect) => {
            const col = document.getElementById(colId);
            if (!col) return;
            col.innerHTML = '';
            // Add padding items
            col.appendChild(createPaddingItem());
            col.appendChild(createPaddingItem());
            items.forEach(val => {
                const div = document.createElement('div');
                div.className = 'picker-item';
                div.textContent = val;
                if (String(val) === String(currentVal)) {
                    div.classList.add('selected');
                }
                div.onclick = () => {
                    col.querySelectorAll('.picker-item').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    onSelect(val);
                    div.scrollIntoView({ behavior: 'smooth', block: 'center' });
                };
                col.appendChild(div);
            });
            col.appendChild(createPaddingItem());
            col.appendChild(createPaddingItem());
        };

        // Bottom Sheet Date Picker controller
        (function () {
            const datePickerOverlay = document.getElementById('date-picker-overlay');
            const datePickerTrigger = document.getElementById('date-picker-trigger');
            const datePickerDisplay = document.getElementById('date-picker-display');
            const dateSelectCompat = document.getElementById('subordinate-date-select');

            // Get yesterday's date as the maximum selectable date (never show today)
            const today = new Date();
            const yesterday = new Date(today);
            yesterday.setDate(yesterday.getDate() - 1);
            const maxYear = yesterday.getFullYear();
            const maxMonth = yesterday.getMonth() + 1;
            const maxDay = yesterday.getDate();
            const yesterdayStr = `${maxYear}-${String(maxMonth).padStart(2, '0')}-${String(maxDay).padStart(2, '0')}`;

            // Restore saved date from localStorage or use default (yesterday)
            let savedDate = localStorage.getItem('sub_selected_date') || yesterdayStr;
            // If saved date is today or in the future, reset to yesterday
            if (savedDate >= `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`) {
                savedDate = yesterdayStr;
                localStorage.setItem('sub_selected_date', yesterdayStr);
            }
            if (datePickerDisplay) datePickerDisplay.textContent = savedDate;
            if (dateSelectCompat) {
                dateSelectCompat.value = savedDate;
                // Load stats for the restored date
                loadStatsForDate(savedDate);
                setTimeout(() => {
                    dateSelectCompat.dispatchEvent(new Event('change'));
                }, 100);
            }

            let currentSelectedYear = savedDate.split('-')[0];
            let currentSelectedMonth = savedDate.split('-')[1];
            let currentSelectedDay = savedDate.split('-')[2];

            const getAvailableYears = () => {
                const list = [];
                for (let y = 2020; y <= maxYear; y++) {
                    list.push(y);
                }
                return list;
            };

            const getAvailableMonths = (selectedYear) => {
                const limit = (parseInt(selectedYear) === maxYear) ? maxMonth : 12;
                return Array.from({ length: limit }, (_, i) => String(i + 1).padStart(2, '0'));
            };

            const getAvailableDays = (selectedYear, selectedMonth) => {
                const yearInt = parseInt(selectedYear);
                const monthInt = parseInt(selectedMonth);
                let limit = new Date(yearInt, monthInt, 0).getDate();
                if (yearInt === maxYear && monthInt === maxMonth) {
                    limit = Math.min(limit, maxDay);
                }
                return Array.from({ length: limit }, (_, i) => String(i + 1).padStart(2, '0'));
            };

            const updateYearColumn = () => {
                const yearsList = getAvailableYears();
                if (!yearsList.includes(parseInt(currentSelectedYear))) {
                    currentSelectedYear = String(yearsList[yearsList.length - 1]);
                }
                populateCol('picker-year-col', yearsList, currentSelectedYear, (val) => {
                    currentSelectedYear = String(val);
                    updateMonthColumn();
                });
                updateMonthColumn();
            };

            const updateMonthColumn = () => {
                const monthsList = getAvailableMonths(currentSelectedYear);
                if (!monthsList.includes(currentSelectedMonth)) {
                    currentSelectedMonth = monthsList[monthsList.length - 1];
                }
                populateCol('picker-month-col', monthsList, currentSelectedMonth, (val) => {
                    currentSelectedMonth = String(val);
                    updateDayColumn();
                });
                updateDayColumn();
            };

            const updateDayColumn = () => {
                const daysList = getAvailableDays(currentSelectedYear, currentSelectedMonth);
                if (!daysList.includes(currentSelectedDay)) {
                    currentSelectedDay = daysList[daysList.length - 1];
                }
                populateCol('picker-day-col', daysList, currentSelectedDay, (val) => {
                    currentSelectedDay = String(val);
                });
            };

            const initPickers = () => {
                const activeDate = dateSelectCompat ? dateSelectCompat.value : yesterdayStr;
                currentSelectedYear = activeDate.split('-')[0];
                currentSelectedMonth = activeDate.split('-')[1];
                currentSelectedDay = activeDate.split('-')[2];

                updateYearColumn();
            };

            if (datePickerTrigger) {
                datePickerTrigger.addEventListener('click', () => {
                    initPickers();
                    datePickerOverlay.style.display = 'block';
                    setTimeout(() => {
                        ['picker-year-col', 'picker-month-col', 'picker-day-col'].forEach(colId => {
                            const selected = document.querySelector(`#${colId} .picker-item.selected`);
                            if (selected) selected.scrollIntoView({ block: 'center' });
                        });
                    }, 80);
                });
            }

            const pickerCancel = document.getElementById('picker-cancel');
            if (pickerCancel) {
                pickerCancel.onclick = () => {
                    datePickerOverlay.style.display = 'none';
                };
            }

            const pickerConfirm = document.getElementById('picker-confirm');
            if (pickerConfirm) {
                pickerConfirm.onclick = () => {
                    const fullDate = `${currentSelectedYear}-${currentSelectedMonth}-${currentSelectedDay}`;
                    if (datePickerDisplay) datePickerDisplay.textContent = fullDate;
                    localStorage.setItem('sub_selected_date', fullDate);

                    if (dateSelectCompat) {
                        dateSelectCompat.value = fullDate;
                        dateSelectCompat.dispatchEvent(new Event('change'));
                    }

                    // Reload stats for the newly selected date
                    loadStatsForDate(fullDate);

                    datePickerOverlay.style.display = 'none';
                };
            }
        })();

        // Bottom Sheet Tier Picker controller
        (function () {
            const tierPickerOverlay = document.getElementById('tier-picker-overlay');
            const tierPickerTrigger = document.getElementById('tier-picker-trigger');
            const tierPickerDisplay = document.getElementById('tier-picker-display');
            const levelSelectCompat = document.getElementById('subordinate-level-select');

            const tiers = [
                { text: 'All', value: 'all' },
                { text: 'Tier 1', value: 'tier1' },
                { text: 'Tier 2', value: 'tier2' },
                { text: 'Tier 3', value: 'tier3' },
                { text: 'Tier 4', value: 'tier4' },
                { text: 'Tier 5', value: 'tier5' },
                { text: 'Tier 6', value: 'tier6' }
            ];

            let tempSelectedTier = levelSelectCompat ? levelSelectCompat.value : 'all';

            const populateTierCol = () => {
                const itemsList = tiers.map(t => t.text);
                const currentText = (tiers.find(t => t.value === tempSelectedTier) || tiers[0]).text;

                populateCol('picker-tier-col', itemsList, currentText, (val) => {
                    const matched = tiers.find(t => t.text === val);
                    if (matched) {
                        tempSelectedTier = matched.value;
                    }
                });
            };

            if (tierPickerTrigger) {
                tierPickerTrigger.addEventListener('click', () => {
                    tempSelectedTier = levelSelectCompat ? levelSelectCompat.value : 'all';
                    populateTierCol();
                    tierPickerOverlay.style.display = 'block';
                    setTimeout(() => {
                        const selected = document.querySelector('#picker-tier-col .picker-item.selected');
                        if (selected) selected.scrollIntoView({ block: 'center' });
                    }, 80);
                });
            }

            const pickerCancel = document.getElementById('tier-picker-cancel');
            if (pickerCancel) {
                pickerCancel.onclick = () => {
                    tierPickerOverlay.style.display = 'none';
                };
            }

            const pickerConfirm = document.getElementById('tier-picker-confirm');
            if (pickerConfirm) {
                pickerConfirm.onclick = () => {
                    const matched = tiers.find(t => t.value === tempSelectedTier);
                    const displayText = matched ? matched.text : 'All';
                    if (tierPickerDisplay) tierPickerDisplay.textContent = displayText;

                    if (levelSelectCompat) {
                        levelSelectCompat.value = tempSelectedTier;
                        levelSelectCompat.dispatchEvent(new Event('change'));
                    }

                    tierPickerOverlay.style.display = 'none';
                };
            }
        })();
    </script>
